[workspace]
resolver = "3"
members = [
    "flexion-stm32",
    "lib/buffer-tool",
    "lib/embassy-unittest",
    "lib/embassy-unittest-macro",
    "lib/flexion",
    "lib/log-to-uart",
    "lib/physical-values",
    "lib/ring-buffer",
    "lib/tc-charger",
    "lib/volatile-value",
    "lib/zero",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
defmt = "1.0.1"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-io-async = "0.7.0"
heapless = "0.9.2"
log = "0.4.29"
phf = { version = "0.13.1", default-features = false, features = ["macros"] }
static_cell = "2.1.1"

buffer-tool = { path = "./lib/buffer-tool" }
embassy-unittest = { path = "./lib/embassy-unittest" }
embassy-unittest-macro = { path = "./lib/embassy-unittest-macro" }
flexion = { path = "./lib/flexion" }
log-to-uart = { path = "./lib/log-to-uart" }
tc-charger = { path = "./lib/tc-charger" }
physical-values = { path = "./lib/physical-values" }
ring-buffer = { path = "./lib/ring-buffer" }
volatile-value = { path = "./lib/volatile-value" }
zero = { path = "./lib/zero" }
